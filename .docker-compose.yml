services:
  # Web server (Nginx) untuk project Laravel Cibeureum Talaga
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: cibeuremtalaga-app:latest
    container_name: cibeuremtalaga-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
    depends_on:
      php:
        condition: service_started
    networks:
      - cibeuremtalaga-net

  # Runtime PHP-FPM 8.3 untuk mengeksekusi kode Laravel & Artisan
  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: php
    image: cibeuremtalaga-php:latest
    container_name: cibeuremtalaga-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-cibeuremtalaga}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy
      composer:
        condition: service_completed_successfully
    networks:
      - cibeuremtalaga-net

  # Container Composer untuk instalasi & manajemen package PHP (vendor + cache volume)
  composer:
    build:
      context: .
      dockerfile: Dockerfile
      target: composer
    image: cibeuremtalaga-composer:latest
    container_name: cibeuremtalaga-composer
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - composer_cache:/tmp/composer
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_CACHE_DIR: /tmp/composer
    command: ["install", "--no-interaction", "--prefer-dist", "--optimize-autoloader"]
    restart: "no"
    networks:
      - cibeuremtalaga-net

  # Database MySQL 8.0 dengan persistent volume
  mysql:
    image: mysql:8.0
    container_name: cibeuremtalaga-mysql
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cibeuremtalaga}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - cibeuremtalaga-net

volumes:
  mysql_data:
    name: cibeuremtalaga_mysql_data
  vendor_data:
    name: cibeuremtalaga_vendor_data
  storage_data:
    name: cibeuremtalaga_storage_data
  composer_cache:
    name: cibeuremtalaga_composer_cache

networks:
  cibeuremtalaga-net:
    name: cibeuremtalaga-net
    driver: bridge

